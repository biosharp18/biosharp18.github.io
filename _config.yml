# Your site's name, introduction, and public address.
title: biosharp18
author: biosharp18
description: "Hello world!"
url: "https://biosharp18.github.io"
baseurl: ""
timezone: Etc/UTC

# Researcher's layouts and styles live in _layouts/ and _sass/.
markdown: kramdown
highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Header links. Add a Resume link here after uploading your own PDF.
nav:
  - name: Home
    link: /
  - name: About
    link: /about/
  - name: GitHub
    link: https://github.com/biosharp18

footer: true
footer_url: "https://github.com/ankitsultana/researcher"
footer_text: "Researcher theme by Ankit Sultana"

# Repository documentation is not part of the public website.
exclude:
  - README.md
  - LICENSE-Researcher.txt
  - Gemfile
  - Gemfile.lock
  - vendor
