---
layout: default
---

{{ content }}

{% if site.posts.size > 0 %}
  <h2>Posts</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time>
      </li>
    {% endfor %}
  </ul>
{% endif %}
